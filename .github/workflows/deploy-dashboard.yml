name: NeuralRepo dashboard CI and deployment
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "studies/**"
      - "experiments/**"
      - "results/**"
      - "registry/**"
      - "governance/models/model_registry.yaml"
      - "scripts/export_dashboard.py"
      - ".github/workflows/deploy-dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "studies/**"
      - "experiments/**"
      - "results/**"
      - "registry/**"
      - "governance/models/model_registry.yaml"
      - "scripts/export_dashboard.py"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exporter dependency
        run: python -m pip install pyyaml
      - name: Export aggregate experiment metrics
        run: python scripts/export_dashboard.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
